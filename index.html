<!DOCTYPE html>
<!-- Declaração do tipo de documento: informa ao navegador que a página usa HTML5 -->
<html lang="pt-BR">
<!-- lang="pt-BR" indica que o conteúdo está em português do Brasil (ajuda leitores de tela e tradutores) -->
<head>
    <!-- Codificação UTF-8: permite exibir acentos e caracteres especiais corretamente -->
    <meta charset="UTF-8">
    <!-- Viewport: faz a página se ajustar à largura da tela de tablets e celulares (base da responsividade) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Descrição da página, usada por mecanismos de busca -->
    <meta name="description" content="Guia do Sistema Solar: planetas, dados comparativos, missões espaciais e curiosidades.">
    <!-- Título exibido na aba do navegador -->
    <title>Guia do Sistema Solar</title>
    <!-- CSS EXTERNO: todo o estilo da página fica no arquivo style.css, ligado aqui pela tag link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== CABEÇALHO =====
         id="cabecalho" porque é um elemento único na página (estilizado com seletor de ID no CSS).
         Ele também é o destino do botão "voltar ao topo". -->
    <header id="cabecalho">
        <!-- Nome do site: o link leva de volta para a seção inicial -->
        <a href="#inicio" class="logo">
            <!-- span vazio com a classe "logo-simbolo": um pequeno sol desenhado só com CSS -->
            <span class="logo-simbolo"></span>
            Guia do Sistema Solar
        </a>
        <!-- Menu de navegação: cada link aponta para o id de uma seção (navegação por âncora) -->
        <nav id="menu" aria-label="Menu principal">
            <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#planetas">Planetas</a></li>
                <li><a href="#comparativo">Comparativo</a></li>
                <li><a href="#missoes">Missões</a></li>
                <li><a href="#curiosidades">Curiosidades</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== CONTEÚDO PRINCIPAL =====
         A tag main agrupa todas as seções da página. Cada seção tem um id
         que é usado pelos links do menu para a navegação por âncora. -->
    <main>
    </main>

</body>
</html>
